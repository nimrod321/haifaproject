<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Over - Simplegames</title>
<link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Bubblegum Sans', cursive;
  overflow: hidden;
  background: #0a0a0a;
  width: 100vw; height: 100vh;
}

/* BG */
#bg {
  position: fixed; inset: 0;
  background-image: url('bg.png');
  background-size: cover; background-position: center;
  z-index: 0;
  filter: brightness(0.6);
}

/* SLOT MACHINE LIGHTS - border of screen */
/* Removed */

/* SCREEN FLASH */
/* Removed */

/* CANVAS */
#coin-canvas {
  position: fixed; inset: 0; z-index: 5;
  pointer-events: none;
}

/* JACKPOT TEXT */
#jackpot-text {
  position: fixed;
  top: 10%;
  left: 50%;
  transform: translateX(-50%) scale(0) rotate(-8deg);
  z-index: 20;
  font-size: clamp(70px, 12vw, 130px);
  color: #f1c40f;
  letter-spacing: 6px;
  white-space: nowrap;
  text-shadow:
    0 0 30px rgba(255,200,0,1),
    0 0 60px rgba(255,150,0,0.8),
    5px 7px 0 #7a3d00,
    3px 5px 0 #b86000;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
  pointer-events: none;
}
#jackpot-text.show { opacity: 1; transform: translateX(-50%) scale(1) rotate(0deg); }

/* SCORE BANNER */
#score-banner {
  position: fixed;
  top: 32%;
  left: 50%;
  transform: translateX(-50%) scale(0.4);
  z-index: 20;
  background: rgba(0,0,0,0.82);
  backdrop-filter: blur(14px);
  border: 5px solid #f1c40f;
  border-radius: 26px;
  padding: 16px 54px;
  text-align: center;
  opacity: 0;
  transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
  box-shadow: 0 0 50px rgba(241,196,15,0.6), 0 10px 40px rgba(0,0,0,0.6);
  pointer-events: none;
}
#score-banner.show { opacity: 1; transform: translateX(-50%) scale(1); }
#score-banner .lbl { font-size: 22px; color: #aaa; display: block; margin-bottom: 4px; }
#score-banner .val { font-size: 76px; color: #f1c40f; text-shadow: 4px 4px 0 #7a3d00, 0 0 30px rgba(255,200,0,0.9); display: block; }

/* CHEST IMAGE */
#chest-container {
  position: fixed;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%) scale(0);
  z-index: 25;
  transition: transform 0.7s cubic-bezier(0.175,0.885,0.32,1.275);
  transform-origin: bottom center;
  pointer-events: none;
  width: 220px;
}
#chest-container.show { transform: translateX(-50%) scale(1); }
#chest-img {
  width: 220px;
  height: auto;
  display: block;
  background: transparent;
  filter: drop-shadow(0 10px 30px rgba(241,196,15,0.6)) drop-shadow(0 20px 40px rgba(0,0,0,0.7));
}

/* COINS FLYING INTO CHEST */
#chest-coin-stream {
  position: fixed;
  bottom: 200px;
  left: 50%;
  z-index: 26;
  pointer-events: none;
}
.stream-coin {
  position: absolute;
  width: 40px; height: 40px;
  border-radius: 50%;
  background-image: url('coin.png');
  background-size: cover;
  opacity: 0;
  transform: translateX(-50%);
  animation: streamDown 0.5s ease-in forwards;
  animation-delay: var(--d, 0s);
}
@keyframes streamDown {
  0%   { transform: translateX(calc(-50% + var(--sx,0px))) translateY(-120px) scaleX(1) rotate(0deg); opacity: 1; }
  40%  { scaleX: 0.15; }
  100% { transform: translateX(-50%) translateY(80px) scaleX(1) rotate(720deg); opacity: 0; }
}

/* PLAY AGAIN */
#play-again-btn {
  position: fixed;
  bottom: 18px; left: 50%;
  transform: translateX(-50%) translateY(30px);
  z-index: 30;
  background: linear-gradient(135deg, #27ae60, #1e8449);
  color: #fff;
  font-family: 'Bubblegum Sans', cursive;
  font-size: 28px;
  padding: 14px 60px;
  border: 4px solid #fff;
  border-radius: 50px;
  cursor: pointer;
  pointer-events: none;
  box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 30px rgba(46,204,113,0.4);
  opacity: 0;
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275), box-shadow 0.2s ease;
}
#play-again-btn.show { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
#play-again-btn:hover {
  background: linear-gradient(135deg, #2ecc71, #27ae60);
  box-shadow: 0 14px 40px rgba(0,0,0,0.5), 0 0 50px rgba(46,204,113,0.7);
  transform: translateX(-50%) translateY(-4px);
}
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="coin-canvas"></canvas>
<div id="jackpot-text">GAME OVER!</div>
<div id="score-banner">
  <span class="lbl">TOTAL SCORE EARNED:</span>
  <span class="val" id="score-val">0</span>
</div>

<!-- Chest -->
<div id="chest-container">
  <img id="chest-img" src="chest_closed.png" alt="chest" style="width:220px; height:auto; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.8));">
</div>
<div id="chest-coin-stream"></div>

<button id="play-again-btn" onclick="location.reload()">🎮 Play Again!</button>

<script>
// ─────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────
const SCORE     = 5000;
const DEMO_MODE = true;

const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd  = (a, b) => a + Math.random() * (b - a);

// ─────────────────────────────────────────
// CANVAS + COIN PHYSICS (slot machine rain)
// ─────────────────────────────────────────
const canvas = document.getElementById('coin-canvas');
const ctx    = canvas.getContext('2d');
let W, H;
const coins  = [];

const GRAVITY  = 0.55;
const BOUNCE   = 0.25;
const FRICTION = 0.78;
const COIN_R   = 24;
const FLOOR_Y  = () => H - 80;

const coinImg = new Image();
coinImg.src   = 'coin.png';

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

let suckingToChest = false;
let chestTarget = { x: 0, y: 0 };
let pileMap = {};

function getPileY(x) {
  let col = Math.floor(x / 15);
  return FLOOR_Y() - (pileMap[col] || 0);
}

class Coin {
  constructor(burst) {
    this.x   = W / 2 + rnd(-W/3, W/3);
    this.y   = rnd(-60, -10);
    const speed = burst ? rnd(8, 15) : rnd(10, 16);
    const angle = rnd(-Math.PI * 0.3, Math.PI * 0.3);
    this.vx  = Math.sin(angle) * speed;
    this.vy  = Math.cos(angle) * speed;
    if (this.vy < 0) this.vy = -this.vy;
    
    this.r   = COIN_R + rnd(-2, 4);
    this.rot     = rnd(0, Math.PI * 2);
    this.rotSpd  = rnd(-0.2, 0.2);
    this.landed  = false;
    this.alpha   = 1;
    this.sucked  = false;
  }

  update() {
    if (this.sucked) return;

    if (!this.landed || suckingToChest) {
       this.rot += this.rotSpd;
    }

    if (suckingToChest) {
       this.landed = false;
       const dx = chestTarget.x - this.x;
       const dy = chestTarget.y - this.y;
       const dist = Math.sqrt(dx*dx + dy*dy);
       const force = 0.5 + (100 / Math.max(10, dist));
       this.vx += (dx / dist) * force;
       this.vy += (dy / dist) * force;
       
       const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
       if (speed > 45) {
         this.vx = (this.vx / speed) * 45;
         this.vy = (this.vy / speed) * 45;
       }

       this.x += this.vx;
       this.y += this.vy;
       
       if (dist < 40) {
          this.sucked = true;
          this.alpha = 0;
       }
       return;
    }

    if (this.landed) return;
    this.vy += GRAVITY;
    this.x  += this.vx;
    this.y  += this.vy;

    const floor = Math.min(getPileY(this.x), FLOOR_Y());
    if (this.y + this.r >= floor) {
      this.y  = floor - this.r;
      this.vy = -Math.abs(this.vy) * BOUNCE;
      this.vx *= FRICTION;
      if (Math.abs(this.vy) < 1.5 && Math.abs(this.vx) < 0.5) {
        this.vy = 0; this.vx = 0; this.rotSpd = 0;
        this.landed = true;
        let col = Math.floor(this.x / 15);
        const addBump = (c, val) => { pileMap[c] = (pileMap[c] || 0) + val; };
        addBump(col, 20);
        addBump(col-1, 15); addBump(col+1, 15);
        addBump(col-2, 10); addBump(col+2, 10);
        addBump(col-3, 5);  addBump(col+3, 5);
      }
    }
  }

  draw() {
    if (this.sucked) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = this.alpha;

    if (coinImg.complete && coinImg.naturalWidth) {
      ctx.drawImage(coinImg, -this.r, -this.r, this.r * 2, this.r * 2);
    }
    
    ctx.restore();
  }
}

let loopActive = false;
function loop() {
  if (!loopActive) return;
  ctx.clearRect(0, 0, W, H);
  for (const c of coins) { c.update(); c.draw(); }
  requestAnimationFrame(loop);
}

// Spawn a wave of coins rapidly (slot machine burst)
function burstCoins(n, burst = false) {
  return new Promise(resolve => {
    let s = 0;
    const iv = setInterval(() => {
      const batch = burst ? Math.min(5, n - s) : Math.min(2, n - s);
      for (let i = 0; i < batch; i++) coins.push(new Coin(burst));
      s += batch;
      if (s >= n) { clearInterval(iv); setTimeout(resolve, 900); }
    }, burst ? 30 : 55);
  });
}

// ─────────────────────────────────────────
// SCORE COUNTER
// ─────────────────────────────────────────
function animCount(el, target, dur = 1600) {
  const t0 = performance.now();
  return new Promise(res => {
    (function step(now) {
      const p = Math.min((now - t0) / dur, 1);
      const e = p < 0.5 ? 2*p*p : -1+(4-2*p)*p;
      el.textContent = Math.round(e * target).toLocaleString();
      if (p < 1) requestAnimationFrame(step); else res();
    })(performance.now());
  });
}

// ─────────────────────────────────────────
// FLASH
// ─────────────────────────────────────────
// Removed

// ─────────────────────────────────────────
// CHEST IMAGE SWAP
// ─────────────────────────────────────────

// ─────────────────────────────────────────
// MAIN SEQUENCE
// ─────────────────────────────────────────
async function runSequence(score) {
  // Reset
  pileMap = {};
  coins.length = 0;
  suckingToChest = false;

  // Phase 1: Small wait
  await wait(200);

  // Phase 2: GAME OVER text slams in
  document.getElementById('jackpot-text').classList.add('show');
  await wait(600);

  // Phase 3: Chest slams in FIRST so coins can fall behind it (z-index naturally handles it)
  document.getElementById('chest-container').classList.add('show');
  await wait(300);

  // Phase 4: Massive coin burst from top
  loopActive = true;
  loop();
  await burstCoins(50, true);   // first burst: wide spread
  await burstCoins(80, false);  // sustained rain: tight column
  await wait(600);

  // Phase 5: Score banner + counter
  document.getElementById('score-banner').classList.add('show');
  await animCount(document.getElementById('score-val'), score);
  await wait(500);

  // Phase 6: Lid opens
  const chestImg = document.getElementById('chest-img');
  if (chestImg) chestImg.src = 'chest_open_empty.png';
  await wait(350);

  // Phase 7: Coins suck into chest
  const chestEl = document.getElementById('chest-container');
  const rect = chestEl.getBoundingClientRect();
  chestTarget = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
  suckingToChest = true;
  
  setTimeout(() => { if (chestImg) chestImg.src = 'chest_open_low.png'; }, 400);
  setTimeout(() => { if (chestImg) chestImg.src = 'chest_open_mid.png'; }, 1000);
  setTimeout(() => { if (chestImg) chestImg.src = 'chest_open_full.png'; }, 1600);
  
  await wait(1800);

  // Phase 8: Chest shakes, lid closes
  chestEl.animate([
    { transform: 'translateX(-50%) scale(1) rotate(0deg)' },
    { transform: 'translateX(-50%) scale(1.1) rotate(-6deg)' },
    { transform: 'translateX(-50%) scale(1.1) rotate(6deg)' },
    { transform: 'translateX(-50%) scale(1.05) rotate(-2deg)' },
    { transform: 'translateX(-50%) scale(1) rotate(0deg)' }
  ], { duration: 500, easing: 'ease-out', fill: 'forwards' });
  if (chestImg) chestImg.src = 'chest_closed.png';
  await wait(400);

  // Phase 9: Play again
  await wait(300);
  document.getElementById('play-again-btn').classList.add('show');
}

// ─────────────────────────────────────────
// LAUNCH
// ─────────────────────────────────────────
if (DEMO_MODE) {
  window.addEventListener('load', () => runSequence(SCORE));
}
window.showGameOver = score => runSequence(score);
</script>
</body>
</html>
