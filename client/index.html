<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilemma Street</title>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Bubblegum Sans', cursive, Arial, sans-serif;
            text-align: center;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0; padding: 0; color: #fff; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px; box-sizing: border-box; }

        h1 {
            color: #fff; text-shadow: 0 0 10px rgba(46, 204, 113, 0.8), 3.5px 3.5px 7px rgba(0,0,0,1);
            font-size: 64px; margin: 15px 0 25px 0; font-weight: bold;
        }

        h2, h3 { color: #f1c40f; text-shadow: 2px 2px 4px #000; font-size: 34px; }
        .hidden { display: none !important; }

        .glass-panel { background: rgba(0,0,0,0.1); padding: 30px; margin: 15px auto; border-radius: 30px; max-width: 600px; backdrop-filter: blur(5px); }

        input {
            margin: 10px auto; padding: 12px 25px; border: 3px solid #2ecc71; border-radius: 50px;
            font-size: 18px; font-family: 'Bubblegum Sans', cursive; background: white; color: #333; outline: none;
            display: block; width: 300px; font-weight: bold;
        }

        button:not(.row-btn):not(.submit-btn) {
            padding: 10px 30px; margin: 10px; font-size: 22px; font-family: 'Bubblegum Sans', cursive; color: #fff;
            background: #27ae60; border: 4px solid #fff; border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: all 0.2s;
        }

        /* SYMMETRIC BOARD */
        .game-board-panel {
            background: #4e342e; border: 10px solid #3e2723; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.6);
            padding: 40px; position: relative; margin: 20px auto; width: 680px; box-sizing: border-box;
            display: flex; justify-content: center; align-items: center;
        }

        .board-layout {
            display: grid;
            grid-template-columns: 80px 220px 220px;
            grid-template-rows: 60px 150px 150px;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .col-header {
            background: #2c3e50; color: #f1c40f; padding: 12px; border-radius: 15px 15px 0 0;
            font-weight: bold; border: 4px solid #3e2723; font-size: 20px; text-align: center;
            display: flex; align-items: center; justify-content: center; height: 35px;
        }
        #col-header-A { grid-column: 2; grid-row: 1; }
        #col-header-B { grid-column: 3; grid-row: 1; }

        .row-btn {
            background: #8d6e63; width: 75px; height: 75px; border-radius: 50%;
            border: 6px solid #3e2723; color: #f1c40f; cursor: pointer;
            box-shadow: 0 8px 0 #2d1b11; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; font-size: 32px;
            position: relative; grid-column: 1;
        }
        .row-btn.selected { transform: translateY(10px); box-shadow: 0 0 0 #2d1b11; background: #c0392b; }
        .row-btn::before { content: 'אני'; position: absolute; left: -55px; color: white; text-shadow: 2px 2px 4px #000; font-size: 22px; }
        #row-btn-A { grid-row: 2; }
        #row-btn-B { grid-row: 3; }

        .matrix-cell {
            background: #3e2723; border: 5px solid #2d1b11; border-radius: 15px;
            position: relative; overflow: hidden; height: 150px; width: 220px;
            display: flex; align-items: center; justify-content: center;
            font-size: 52px; font-weight: bold; font-family: 'Bubblegum Sans', cursive;
        }
        #cell-AA { grid-column: 2; grid-row: 2; }
        #cell-AB { grid-column: 3; grid-row: 2; }
        #cell-BA { grid-column: 2; grid-row: 3; }
        #cell-BB { grid-column: 3; grid-row: 3; }

        .p1-val { color: #ff4757; text-shadow: 2px 2px 6px rgba(0,0,0,0.8); }
        .p2-val { color: #2e86de; text-shadow: 2px 2px 6px rgba(0,0,0,0.8); }
        .val-separator { color: #fff; margin: 0 12px; opacity: 0.3; }

        .door-container { position: absolute; inset: 0; z-index: 5; display: flex; pointer-events: none; }
        .door-half {
            flex: 1; background: #5d4037; border: 1px solid #3e2723;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background-image: repeating-linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.2) 10px, transparent 10px, transparent 20px);
        }
        .door-left { border-right: 2px solid #2d1b11; transform: translateX(-102%); }
        .door-right { border-left: 2px solid #2d1b11; transform: translateX(102%); }
        .cell-closed .door-left { transform: translateX(0) !important; }
        .cell-closed .door-right { transform: translateX(0) !important; }

        .submit-btn {
            background: #5d4037; color: #f1c40f; font-size: 36px; padding: 18px 70px;
            border: 5px solid #3e2723; border-radius: 20px; cursor: pointer;
            box-shadow: 0 10px 0 #2d1b11, 0 15px 30px rgba(0,0,0,0.5);
            transition: all 0.2s; font-family: 'Bubblegum Sans', cursive; margin-top:20px;
        }

        /* RE-ADDED BOT SELECTION AREA (CLEAN) */
        .bot-selection { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; text-align: left; margin: 10px 0; font-size: 14px; }
        .bot-line { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }

        /* PURPLE MAGICAL CHEST */
        .chest-float { position: fixed; bottom: 40px; left: 40px; width: 140px; height: 120px; z-index: 1000; }
        .magical-chest {
            width: 100%; height: 100%; background: #8e44ad; border: 4px solid #f1c40f;
            border-radius: 15px 15px 10px 10px; position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.5);
        }
        .chest-band { position: absolute; width: 15px; height: 100%; background: #f1c40f; top: 0; box-shadow: 2px 0 5px rgba(0,0,0,0.3); }
        .band-left { left: 25px; }
        .band-right { right: 25px; }
        .chest-lock-logo {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 50px; background: #f1c40f; border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
        }
        .chest-lock-logo::after {
            content: ''; width: 8px; height: 12px; background: #333; border-radius: 50% 50% 0 0; position: relative; top: -5px;
        }

        .queued-point-bubble {
            padding: 5px 20px; border-radius: 30px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: 2px solid #f1c40f; 
            color: #fff; font-weight: bold; font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            position: absolute; left: 50%; 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            opacity: 0;
            transform: translateX(-50%) scale(0);
            z-index: 200;
            white-space: nowrap;
        }


        #reveal-countdown-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2500; display: none; align-items: center; justify-content: center; pointer-events: none; }
        #countdown-text { font-size: 280px; color: #f1c40f; text-shadow: 10px 10px 50px #000, 0 0 30px #fff; animation: pulse-countdown 1s ease-in-out infinite; }
        #result-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: rgba(0,0,0,0.96); border: 12px solid #f1c40f; border-radius: 40px; padding: 60px; z-index: 3000; opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #result-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: all; }
    </style>
</head>

<body>
    <div id="loading-overlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column;">
        <div style="border: 8px solid rgba(255,255,255,0.1); border-top: 8px solid #f1c40f; border-radius: 50%; width: 70px; height: 70px; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <h1 id="loading-text">Loading...</h1>
    </div>

    <div class="container">
        <h1>Dilemma Street</h1>
        
        <div id="auth">
            <div id="login-section" class="glass-panel">
                <h2>Login / Register</h2>
                <input type="text" id="login-username" placeholder="Username">
                <input type="password" id="login-password" placeholder="Password">
                <button onclick="login()">Login</button>
                <button onclick="signup()" style="background:#3498db; margin-top:10px;">Create Account</button>
            </div>
        </div>

        <!-- Admin -->
        <div id="admin-panel" class="hidden" style="width: 100%; max-width: 1100px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Admin Dashboard</h2>
                <button class="btn-danger" style="font-size:16px;" onclick="location.reload()">Logout</button>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap: 20px; margin-top:20px;">
                <div class="admin-card glass-panel" style="background:rgba(0,0,0,0.4);">
                    <h3>Create Room</h3>
                    <input type="password" id="admin-room-password" placeholder="Room Password">
                    <input type="number" id="admin-room-rounds" placeholder="Rounds" value="10">
                    <input type="file" id="admin-room-excel" accept=".xlsx, .xls">
                    <!-- BOT SELECTION ADDED BACK -->
                    <div class="bot-selection">
                        <div class="bot-line"><label><input type="checkbox" class="bot-check" value="Random" checked> Random Bot</label></div>
                        <div class="bot-line"><label><input type="checkbox" class="bot-check" value="CBot" checked> Always Cooperate (CBot)</label></div>
                        <div class="bot-line"><label><input type="checkbox" class="bot-check" value="DBot"> Always Defect (DBot)</label></div>
                        <div class="bot-line"><label><input type="checkbox" class="bot-check" value="TitForTat"> Tit-For-Tat</label></div>
                        <div class="bot-line"><label><input type="checkbox" class="bot-check" value="Copycat"> Copycat</label></div>
                        <div class="bot-line"><label><input type="checkbox" class="bot-check" value="SERS_1"> SERS Bot (1 Mem)</label></div>
                        <div class="bot-line"><label><input type="checkbox" class="bot-check" value="SERS_3"> SERS Bot (3 Mem)</label></div>
                        <div class="bot-line"><label><input type="checkbox" class="bot-check" value="SERS_5" checked> SERS Bot (5 Mem)</label></div>
                    </div>
                    <button onclick="adminCreateRoom()" style="width:100%; margin-top:15px;">Create Room</button>
                </div>
                <div class="admin-card glass-panel" style="background:rgba(0,0,0,0.4);">
                    <h3>Manage Rooms & Logs</h3>
                    <div id="admin-rooms-list" style="max-height: 250px; overflow-y: auto;"></div>
                    <div id="log-viewer-panel" style="display:none; margin-top:15px; position:relative;"></div>
                </div>
                <div class="admin-card glass-panel" style="background:rgba(0,0,0,0.4); grid-column: span 2;">
                    <h3>Manage Players</h3>
                    <div id="admin-players-list" style="max-height: 250px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>

        <div id="game" class="hidden">
            <div id="prison-join-form" class="glass-panel">
                <h2>Join Room</h2>
                <input type="password" id="prison-password" placeholder="Room Password">
                <button onclick="enterRoom()">Enter</button>
            </div>

            <div id="room-lobby" class="glass-panel hidden">
                <button onclick="queueForGame()" id="start-game-btn" class="submit-btn" style="padding: 10px 40px; font-size:30px;">START GAME</button>
                <div id="lobby-message" style="margin-top:20px; font-weight:bold; color:#f1c40f;"></div>
            </div>

            <div id="prison" class="hidden">
                <div class="game-board-panel">
                    <div class="board-layout">
                        <div class="col-header" id="col-header-A">שחקן 2 A</div>
                        <div class="col-header" id="col-header-B">שחקן 2 B</div>
                        <button id="row-btn-A" class="row-btn" onclick="selectRow('A')">A</button>
                        <div class="matrix-cell" id="cell-AA"><div class="cell-content"></div><div class="door-container"><div class="door-half door-left"></div><div class="door-half door-right"></div></div></div>
                        <div class="matrix-cell" id="cell-AB"><div class="cell-content"></div><div class="door-container"><div class="door-half door-left"></div><div class="door-half door-right"></div></div></div>
                        <button id="row-btn-B" class="row-btn" onclick="selectRow('B')">B</button>
                        <div class="matrix-cell" id="cell-BA"><div class="cell-content"></div><div class="door-container"><div class="door-half door-left"></div><div class="door-half door-right"></div></div></div>
                        <div class="matrix-cell" id="cell-BB"><div class="cell-content"></div><div class="door-container"><div class="door-half door-left"></div><div class="door-half door-right"></div></div></div>
                    </div>
                </div>
                <button id="submit-choice-btn" class="submit-btn" onclick="submitChoice()" disabled>שלח</button>
                <div id="prison-message" style="margin-top:15px; font-weight:bold; color:#f1c40f; font-size:22px;"></div>
                
                <div class="chest-float" id="treasure-chest">
                    <div class="magical-chest">
                        <div class="chest-band band-left"></div>
                        <div class="chest-band band-right"></div>
                        <div class="chest-lock-logo"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="reveal-countdown-overlay"><div id="countdown-text">3</div></div>
    <div id="result-popup">
        <div id="popup-my-score" style="font-size:46px; color:#2ecc71;">Your: 0</div>
        <div id="popup-op-score" style="font-size:46px; color:#e74c3c; margin-top:10px;">Opponent: 0</div>
    </div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        const socket = io();
        let selectedMove = null, currentGid = null, currentUsername = null, currentUserRole = null, choiceLocked = false;

        function showLoading(t) { const o=document.querySelector('#loading-overlay'); o.style.display='flex'; o.querySelector('#loading-text').textContent=t; }
        function hideLoading() { document.querySelector('#loading-overlay').style.display='none'; }

        async function login() {
            const u = document.getElementById('login-username').value, p = document.getElementById('login-password').value;
            showLoading('Logging in...');
            const res = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
            const data = await res.json(); hideLoading();
            if (res.ok) { currentUsername = u; currentUserRole = data.user.role; document.getElementById('auth').classList.add('hidden');
            if(currentUserRole === 'admin') { document.getElementById('admin-panel').classList.remove('hidden'); loadAdminRooms(); loadAdminPlayers(); } else { document.getElementById('game').classList.remove('hidden'); }
            } else alert(data.error);
        }

        async function signup() {
            const u = document.getElementById('login-username').value, p = document.getElementById('login-password').value;
            showLoading('Creating Account...');
            const res = await fetch('/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
            const data = await res.json(); hideLoading();
            if (res.ok) { alert('Account created! Please login.'); } else { alert(data.error); }
        }

        async function adminCreateRoom() {
            const pw = document.getElementById('admin-room-password').value, rd = parseInt(document.getElementById('admin-room-rounds').value) || 10;
            if(!pw) return alert('Password required');
            const bots = []; document.querySelectorAll('.bot-check').forEach(c => { if(c.checked) bots.push(c.value); });

            let sess = null; const f = document.getElementById('admin-room-excel');
            if(f.files.length > 0) { sess = await parseExcel(f.files[0]); }
            const res = await fetch('/create_room', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, num_sessions: rd, allowed_bots: bots, sessions: sess }) });
            if(res.ok) { alert('Room Created!'); loadAdminRooms(); } else alert('Failed');
        }
        function parseExcel(file) { return new Promise((resolve) => { const reader = new FileReader(); reader.onload = (e) => { resolve(XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(e.target.result), { type: 'array' }).Sheets[XLSX.read(new Uint8Array(e.target.result), { type: 'array' }).SheetNames[0]])); }; reader.readAsArrayBuffer(file); }); }
        
        async function loadAdminRooms() {
            const res = await fetch('/get_rooms'); const data = await res.json();
            const list = document.getElementById('admin-rooms-list'); list.innerHTML = '';
            data.forEach(room => {
                const item = document.createElement('div'); item.className='room-item'; 
                item.innerHTML = `Room: ${room.password} 
                    <button class="btn-small" onclick="viewLogs('${room.password}')" style="background:#3498db; margin-left:10px;">View Logs</button>
                    <button class="btn-small" onclick="downloadLogs('${room.password}')" style="background:#2ecc71;">CSV</button>
                    <button class="btn-small btn-danger" onclick="deleteRoom('${room.password}')">X</button>`;
                list.appendChild(item);
            });
        }

        async function viewLogs(pw) {
            const res = await fetch('/get_room_logs', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: pw}) });
            const data = await res.json();
            if(!data.logs || data.logs.length === 0) return alert('No logs found for this room.');
            
            let html = `<div style="display:flex; justify-content:space-between; align-items:center;">
                            <h4>Logs for Room: ${pw}</h4>
                            <button class="btn-small btn-danger" onclick="document.getElementById('log-viewer-panel').style.display='none'">Close Logs</button>
                        </div>
                        <ul style="text-align:left; font-size:14px; max-height:400px; overflow-y:auto; background:rgba(0,0,0,0.5); padding:10px; border-radius:10px; list-style-type:none;">`;
            const groups = {};
            data.logs.forEach(l => { if(!groups[l.game_id]) groups[l.game_id] = []; groups[l.game_id].push(l); });
            
            for(const [gId, logs] of Object.entries(groups)) {
                let p1tot=0, p2tot=0;
                html += `<li style="margin-bottom:15px; border-bottom: 1px solid #777; padding-bottom:5px;">
                            <strong style="color:#f1c40f;">Session: ${gId}</strong><br> 
                            Players: ${logs[0].player1} vs ${logs[0].player2} <br><ul style="list-style-type:circle; margin-left:20px;">`;
                logs.forEach(l => {
                    p1tot += l.p1_points; p2tot += l.p2_points;
                    html += `<li>Round ${l.session_index} [Matrix: ${l.matrix_id}]: ${l.code} (P1: ${l.p1_points}, P2: ${l.p2_points}) at ${l.timestamp}</li>`;
                });
                html += `</ul><strong style="color:#2ecc71;">Total Score -> P1: ${p1tot}, P2: ${p2tot}</strong></li>`;
            }
            html += '</ul>';
            document.getElementById('log-viewer-panel').innerHTML = html;
            document.getElementById('log-viewer-panel').style.display = 'block';
        }

        async function downloadLogs(pw) {
            const res = await fetch('/get_room_logs', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: pw}) });
            const data = await res.json();
            if(!data.logs || data.logs.length === 0) return alert('No logs found for this room.');
            
            const worksheet = XLSX.utils.json_to_sheet(data.logs);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Session_Logs");
            XLSX.writeFile(workbook, `Room_${pw}_Logs.csv`);
        }

        async function deleteRoom(pw) { await fetch('/delete_room', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: pw}) }); loadAdminRooms(); }

        function enterRoom() { socket.emit('enterRoom', { password: document.getElementById('prison-password').value }); }
        socket.on('roomEntered', () => { document.getElementById('prison-join-form').classList.add('hidden'); document.getElementById('room-lobby').classList.remove('hidden'); });

        function queueForGame() { 
            const pw = document.getElementById('prison-password').value; 
            socket.emit('joinPrison', { username: currentUsername, password: pw }); 
            // The server handles the 10-second logic
        }

        socket.on('prisonWaiting', () => {
            document.getElementById('start-game-btn').style.display = 'none';
            document.getElementById('lobby-message').innerHTML = `
                <div style="font-size: 28px; color: #f1c40f; margin-bottom: 20px;">
                    <div style="display:inline-block; border: 5px solid rgba(255,255,255,0.2); border-top: 5px solid #f1c40f; border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 15px;"></div>
                    Looking for partner...
                </div>
            `;
        });

        socket.on('prisonMatchFound', () => {
             document.getElementById('start-game-btn').style.display = 'none';
             document.getElementById('lobby-message').innerHTML = `
                 <div style="font-size: 34px; color: #2ecc71; animation: pulse 1s infinite alternate;">
                     Match Found!
                 </div>
             `;
        });
        
        socket.on('prisonStart', d => {
            currentGid = d.gameId;
            renderMatrix(d.matrix);
            document.getElementById('room-lobby').classList.add('hidden'); 
            document.getElementById('prison').classList.remove('hidden');
            openAllDoors();
            choiceLocked = false; 
        });

        function renderMatrix(m) { ['AA','AB','BA','BB'].forEach(c => { const cell = document.getElementById(`cell-${c}`); cell.querySelector('.cell-content').innerHTML = `<span class="p1-val">${m[c+'1']}</span><span class="val-separator">|</span><span class="p2-val">${m[c+'2']}</span>`; }); }
        function openAllDoors() { document.querySelectorAll('.matrix-cell').forEach(c => c.classList.remove('cell-closed')); }
        function closeAllDoors() { document.querySelectorAll('.matrix-cell').forEach(c => c.classList.add('cell-closed')); }

        function selectRow(r) {
            if(choiceLocked) return;
            if (selectedMove === r) {
                selectedMove = null; document.getElementById('row-btn-A').classList.remove('selected'); document.getElementById('row-btn-B').classList.remove('selected'); document.getElementById('submit-choice-btn').disabled = true;
                openAllDoors();
            } else {
                selectedMove = r; document.getElementById('row-btn-A').classList.remove('selected'); document.getElementById('row-btn-B').classList.remove('selected'); document.getElementById(`row-btn-${r}`).classList.add('selected'); document.getElementById('submit-choice-btn').disabled = false;
                const unchosen = (r === 'A' ? 'B' : 'A');
                document.querySelectorAll(`.matrix-cell[id^="cell-${r}"]`).forEach(c => c.classList.remove('cell-closed'));
                document.querySelectorAll(`.matrix-cell[id^="cell-${unchosen}"]`).forEach(c => c.classList.add('cell-closed'));
            }
        }

        function submitChoice() { 
            if(!selectedMove || choiceLocked) return; 
            choiceLocked = true;
            document.getElementById('submit-choice-btn').disabled = true; 
            socket.emit('prisonChooseRow', { gameId: currentGid, row: selectedMove }); 
            document.getElementById('prison-message').textContent = 'Submitting Move...'; 
        }

        socket.on('prisonRoundResult', d => {
            const sequence = async () => {
                const overlay = document.getElementById('reveal-countdown-overlay'); const text = document.getElementById('countdown-text');
                overlay.style.display = 'flex';
                for(let i=3; i>0; i--) { text.textContent = i; await new Promise(r => setTimeout(r, 1000)); }
                overlay.style.display = 'none';

                const chosenCol = d.op_choice; 
                const unchosenCol = (chosenCol === 'A' ? 'B' : 'A');
                document.querySelectorAll(`.matrix-cell[id$="${unchosenCol}"]`).forEach(c => c.classList.add('cell-closed'));
                await new Promise(r => setTimeout(r, 800));

                document.getElementById('popup-my-score').textContent = `Your: ${d.my_score}`;
                document.getElementById('popup-op-score').textContent = `Opponent: ${d.op_score}`;
                document.getElementById('result-popup').classList.add('active');
                
                spawnPointBubbles(d.my_score, d.op_score);
                
                await new Promise(r => setTimeout(r, 3000)); 
                document.getElementById('result-popup').classList.remove('active');
                
                closeAllDoors();
                await new Promise(r => setTimeout(r, 1000));

                if(d.done) { alert('Game Over!'); location.reload(); }
            };
            sequence();
        });

        let floatingScores = [];

        function spawnPointBubbles(my_score, op_score) {
            const chest = document.getElementById('treasure-chest');
            const b = document.createElement('div'); 
            b.className = 'queued-point-bubble';
            b.innerHTML = `<span style="color:#2ecc71; text-shadow:0 0 10px #2ecc71;">${my_score}</span><span style="color:#fff; margin:0 5px;">,</span><span style="color:#e74c3c; text-shadow:0 0 10px #e74c3c;">${op_score}</span>`;
            
            floatingScores.push(b);
            updateChestQueue(chest);
        }

        function updateChestQueue(chest) {
            // Drop oldest into chest if length > 3
            while (floatingScores.length > 3) {
                const oldest = floatingScores.shift();
                oldest.style.transform = `translate(-50%, 60px) scale(0)`;
                oldest.style.opacity = '0';
                setTimeout(() => { if (oldest.parentNode) oldest.remove(); }, 500);
            }
            
            // Adjust remaining
            floatingScores.forEach((bubble, idx) => {
                const verticalOffset = -50 - ((floatingScores.length - 1 - idx) * 50); 
                if (!bubble.parentNode) {
                    chest.appendChild(bubble);
                }
                
                requestAnimationFrame(() => {
                    bubble.style.opacity = '1';
                    bubble.style.transform = `translate(-50%, ${verticalOffset}px) scale(1)`;
                });
            });
        }

        socket.on('prisonNextRound', d => {
            // Wait for the reveal sequence (3s countdown + 3s result + 1s close) to finish before opening fresh
            setTimeout(() => {
                renderMatrix(d.matrix);
                selectedMove = null; 
                document.getElementById('row-btn-A').classList.remove('selected'); 
                document.getElementById('row-btn-B').classList.remove('selected');
                document.getElementById('submit-choice-btn').disabled = true; 
                document.getElementById('prison-message').textContent = '';
                openAllDoors();
                choiceLocked = false;
            }, 8500); // Increased to match reveal sequence length
        });

        async function loadAdminPlayers() {
            const res = await fetch('/get_players', { method: 'POST' }); 
            const data = await res.json();
            const list = document.getElementById('admin-players-list'); list.innerHTML = '';
            data.forEach(p => {
                if (p.role === 'admin') return;
                const item = document.createElement('div'); item.className='room-item'; item.style.display = 'flex'; item.style.justifyContent = 'space-between';
                item.innerHTML = `<span><strong>${p.username}</strong> | Sessions completed: ${p.session_counter}</span> 
                    <button class="btn-small btn-danger" onclick="banPlayer('${p.username}')">Ban User</button>`;
                list.appendChild(item);
            });
        }
        async function banPlayer(u) {
            if(!confirm(`Are you sure you want to completely ban ${u}?`)) return;
            const res = await fetch('/ban_player', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u}) });
            if (res.ok) { alert('Player banned.'); loadAdminPlayers(); }
        }
    </script>
</body>
</html>
